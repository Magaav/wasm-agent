[package]
name = "nnrunner"
version = "0.1.0"
edition = "2021"
publish = false

# Spike harness: a wasip2 command component with wasi-nn (ONNX Runtime backend). Not the kernel.
[workspace]

[dependencies]
wasmtime = { version = "37", default-features = false, features = ["cranelift", "runtime", "std", "component-model"] }
wasmtime-wasi = { version = "37", default-features = false, features = ["p2"] }
wasmtime-wasi-nn = { version = "37", default-features = false, features = ["onnx-download"] }
anyhow = "1"
# Pin ONNX Runtime bindings to the version wasmtime-wasi-nn 37 was built against (newer rc.x changed the download/TLS features and API).
ort = { version = "=2.0.0-rc.2", default-features = false }
ort-sys = { version = "=2.0.0-rc.2", default-features = false }
