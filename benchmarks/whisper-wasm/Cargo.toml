[package]
name = "wa-whisper-wasm-benchmark"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
base64 = "0.22"
candle-core = "=0.11.0"
candle-nn = "=0.11.0"
candle-transformers = "=0.11.0"
getrandom = "0.3"
num-traits = "0.2"
safetensors = "0.8"
serde_json = "1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }

[workspace]

[profile.release]
opt-level = 3
lto = true
