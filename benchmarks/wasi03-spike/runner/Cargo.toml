[package]
name = "wasi03-runner"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std", "component-model", "component-model-async", "async"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p2"] }
