[package]
name = "luarunner"
version = "0.1.0"
edition = "2021"
publish = false

# Spike harness: hosts the Lua component; implements host-call with a few real capabilities.
[workspace]

[dependencies]
wasmtime = { version = "37", default-features = false, features = ["cranelift", "runtime", "std", "component-model", "gc", "gc-drc"] }
wasmtime-wasi = { version = "37", default-features = false, features = ["p2"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ring = "0.17"
serde_json = "1"
anyhow = "1"
