[package]
name = "luaguest"
version = "0.1.0"
edition = "2021"
publish = false

# Spike: Lua 5.4 (wa-host's vendored C) inside a wasm32-wasip2 component; host.* via one WIT import.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"

[build-dependencies]
cc = "1"

[profile.release]
opt-level = 2
strip = true
