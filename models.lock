# The model assets the vision component is handed by the host, pinned by sha256 beside the component
# pins in components.lock (Victor 27/11: host-supplied, fetched once, never embedded in the artifact).
#
# The component refuses a byte that does not hash to the value here (model-hash-mismatch), and
# wa:vision models() answers these three hashes in this order, so an operator asking which reader is
# running gets the answer from the reader itself.
#
# source: the model pair ships inside rapidocr_onnxruntime (the engine this seam replaces); the dictionary
# is read from the rec model own ONNX metadata, so the three files cannot drift apart.
#
