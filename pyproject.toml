[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wasm-agent"
version = "0.1.0"
description = "Portable, local-first agent foundation: organized memory in plain SQLite."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wasm-agent contributors" }]
keywords = ["agent", "memory", "sqlite", "local-first", "whatsapp"]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
wasm-agent = "wasm_agent.cli:main"
wa = "wasm_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wasm_agent = ["memory/schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
