<!doctype html>
<html lang="en">
<head>
<script id="wa-error-reporter">
// Report this page's own failures to the node. Installed first, inline, so it catches everything after
// it - including a syntax or load error in app.js, which is exactly the case that leaves a window looking
// alive while its page is dead. A page that cannot run cannot tell anyone it cannot run, so the only place
// this can live is here.
(function () {
  var sent = 0;
  function report(kind, text) {
    try {
      if (sent > 20) return;            // a loop must not be able to flood the node
      sent += 1;
      var body = JSON.stringify({ kind: kind, text: String(text).slice(0, 2000), url: location.href });
      var request = new XMLHttpRequest();
      request.open("POST", "/log", true);
      request.setRequestHeader("Content-Type", "application/json");
      request.send(body);
    } catch (error) { /* nothing left to do if even this fails */ }
  }
  window.addEventListener("error", function (event) {
    report("error", (event && event.message ? event.message : "error") + " @ " + (event && event.filename) + ":" + (event && event.lineno));
  });
  window.addEventListener("unhandledrejection", function (event) {
    report("rejection", (event && event.reason && (event.reason.stack || event.reason.message)) || "unhandled rejection");
  });
  var realError = console.error;
  console.error = function () {
    report("console", Array.prototype.map.call(arguments, function (a) {
      return a && a.stack ? a.stack : String(a);
    }).join(" "));
    return realError.apply(console, arguments);
  };
})();
</script>

  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>wasm-agent</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // Surface runtime errors in the window title (GUI builds have no console).
    window.addEventListener("error", (event) => {
      document.title = "wasm-agent · error: " + (event.message || event.error);
    });
    window.addEventListener("unhandledrejection", (event) => {
      const reason = event.reason;
      document.title = "wasm-agent · error: " + ((reason && reason.message) || reason);
    });
  </script>
</head>
<body class="expanded">
  <div id="orb" class="orb" title="wasm-agent">
    <span class="orb-ring"></span>
    <span class="orb-core"></span>
  </div>

  <div id="panel" class="panel">
    <header class="topbar" id="dragbar">
      <div class="brand"><span class="dot"></span> wasm-agent</div>
      <div class="meta" id="meta">connecting…</div>
      <div class="topbar-actions">
        <button id="engine-btn" class="topbar-btn" type="button" title="Engine (Ctrl+E)" aria-label="Engine">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <button id="term-btn" class="topbar-btn" type="button" title="Shell (Ctrl+`)" aria-label="Shell">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 17h8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
        <button id="diff-btn" class="topbar-btn" type="button" title="Drift (Ctrl+D)" aria-label="Drift">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="7" cy="18.5" r="1.9" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="7" cy="4" r="1.9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M15 4v12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="15" cy="18.5" r="1.9" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="15" cy="4" r="1.9" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
        </button>
        <button id="collapse" class="collapse" title="Collapse to avatar" aria-label="Collapse to avatar">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <main id="messages" class="messages">
      <button type="button" id="jump" class="jump" title="Jump to the latest">\u2193 latest</button>
      <div class="empty" id="empty">
        <h1>wasm-agent</h1>
        <p>Talk to your agent. It remembers what you tell it and can search your message ledger.</p>
        <div class="hints">
          <button data-prompt="remember that Laura prefers invoices on the 5th">remember a fact</button>
          <button data-prompt="what do you know about Laura?">recall a fact</button>
          <button data-prompt="use the echo tool to echo 'wasm plugins are alive'">use a WASM tool</button>
        </div>
      </div>
    </main>

    <section id="terminal" class="terminal" hidden>
      <header class="term-bar">
        <span class="term-title" id="term-title">shell</span>
        <button id="term-close" class="icon-btn" type="button" title="Back to chat (Esc)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 6v12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div id="term-out" class="term-out"></div>
      <form id="term-form" class="term-in">
        <span class="term-prompt">&gt;</span>
        <input id="term-cmd" autocomplete="off" spellcheck="false"
               placeholder="shell on this machine — :spells, :run &lt;name&gt;, :clear" />
      </form>
    </section>

    <section id="engine" class="engine" hidden>
      <header class="engine-bar">
        <span class="engine-title">engine</span>
        <span class="engine-sub" id="engine-sub"></span>
        <button id="engine-close" class="icon-btn" type="button" title="Back to chat (Esc)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 6v12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="engine-body">
        <div class="engine-topic">
          <button class="engine-head" type="button" data-target="nodes-box">
            <span class="engine-caret">▸</span><span class="engine-name">nodes</span>
            <span class="engine-note" id="nodes-binding"></span>
          </button>
          <div class="engine-content" id="nodes-box" hidden></div>
        </div>
        <div class="engine-topic">
          <button class="engine-head" type="button" data-target="sessions-box">
            <span class="engine-caret">▸</span><span class="engine-name">sessions</span>
            <span class="engine-note" id="sessions-note"></span>
          </button>
          <div class="engine-content" id="sessions-box" hidden></div>
        </div>
        <div class="engine-topic">
          <button class="engine-head" type="button" data-target="skills-box">
            <span class="engine-caret">▸</span><span class="engine-name">skills</span>
            <span class="engine-note" id="skills-note"></span>
          </button>
          <div class="engine-content" id="skills-box" hidden></div>
        </div>
        <div class="engine-topic">
          <button class="engine-head" type="button" data-target="spells-box">
            <span class="engine-caret">▸</span><span class="engine-name">spells</span>
            <span class="engine-note" id="spells-note"></span>
          </button>
          <div class="engine-content" id="spells-box" hidden></div>
        </div>
        <div class="engine-topic">
          <button class="engine-head" type="button" data-target="tools-box">
            <span class="engine-caret">▸</span><span class="engine-name">tools</span>
            <span class="engine-note">envelope the model sees</span>
          </button>
          <div class="engine-content" id="tools-box" hidden></div>
        </div>
        <div class="engine-topic">
          <button class="engine-head" type="button" data-target="jobs-box">
            <span class="engine-caret">▸</span><span class="engine-name">jobs</span>
            <span class="engine-note">triggers → queued actions</span>
          </button>
          <div class="engine-content" id="jobs-box" hidden><wa-jobs></wa-jobs></div>
        </div>
      </div>
    </section>

    <section id="drift" class="drift" hidden>
      <header class="engine-bar">
        <span class="engine-title">drift</span>
        <span class="engine-sub" id="drift-sub"></span>
        <button id="drift-refresh" class="icon-btn" type="button" title="Re-read (r)" aria-label="Re-read">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/><path d="M20 4v4h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="drift-close" class="icon-btn" type="button" title="Back to chat (Esc)" aria-label="Back to chat">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 6v12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="engine-body" id="drift-body"></div>
    </section>

    <section id="control" class="control" hidden>
      <header class="control-bar">
        <span class="control-title" id="control-title">control</span>
        <span class="control-hint" id="control-hint"></span>
        <label class="control-live"><input id="control-live" type="checkbox" checked /> live</label>
        <button id="control-refresh" class="icon-btn" type="button" title="Force a full frame">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        </button>
        <button id="control-max" class="icon-btn" type="button" title="Maximize">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <button id="control-close" class="icon-btn" type="button" title="Close control">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </header>
      <div class="control-view" id="control-view">
        <canvas id="control-canvas"></canvas>
      </div>
      <form id="control-keys" class="control-keys">
        <input id="control-text" autocomplete="off" placeholder="type text, Enter sends it to the node" />
        <button class="icon-btn" type="submit" title="Send text">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h12M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </form>
    </section>

    <form id="composer" class="composer">
      <div id="attachments" class="attachments"></div>
      <div class="composer-row">
        <textarea id="input" rows="1" placeholder="Message wasm-agent…"></textarea>
        <button id="send" class="send" type="submit" title="Send" aria-label="Send">
          <svg class="icon-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 21 23 12 2 3v7l15 2-15 2z"/></svg>
          <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
        </button>
      </div>
      <div class="composer-footer">
        <div class="footer-left">
          <!-- The pill is the icon and nothing beside it. A name there was truncated to "ma…",
               which said nothing the tooltip does not say better. -->
          <button id="user-btn" class="chip user-chip" type="button" title="Account" aria-haspopup="true" aria-label="Account">
            <span class="user-avatar" id="user-avatar">?</span>
          </button>
          <button id="status-btn" class="chip" type="button" title="Provider, model and usage" aria-haspopup="true" aria-expanded="false">
            <span class="chip-dot"></span>
            <span id="chip-model">connecting…</span>
            <span id="chip-usage" class="chip-usage"></span>
          </button>
          <button id="mic" class="icon-btn" type="button" title="Talk with voice" aria-label="Talk with voice">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 0 1 3 3v5a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zm7 8a7 7 0 0 1-6 6.9V21h-2v-3.1A7 7 0 0 1 5 11h2a5 5 0 0 0 10 0h2z"/></svg>
          </button>
          <button id="attach" class="icon-btn" type="button" title="Append a file" aria-label="Append a file">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 6.6 8.7 14.4a1.5 1.5 0 0 0 2.1 2.1l7.8-7.8a3.5 3.5 0 0 0-5-5l-8.1 8.1a5.5 5.5 0 0 0 7.8 7.8l6.7-6.7-1.4-1.4-6.7 6.7a3.5 3.5 0 0 1-5-5l8.1-8.1a1.5 1.5 0 0 1 2.1 2.1z"/></svg>
          </button>
          <input id="file" type="file" hidden multiple />
        </div>
        <div class="footer-right">
          <span id="composer-model" class="composer-model" title="Model used for the latest request">connecting…</span>
        </div>
      </div>

      <wa-balloon id="status-balloon" class="popover" anchor="status-btn">
        <div class="pop-row">
          <label class="pop-head" for="provider-select">provider</label>
          <select id="provider-select" class="wa-select"></select>
        </div>
        <div class="pop-row">
          <label class="pop-head" for="model-select">model</label>
          <select id="model-select" class="wa-select"></select>
        </div>
        <div class="pop-row">
          <label class="pop-head" for="reasoning-select">reasoning</label>
          <select id="reasoning-select" class="wa-select"></select>
        </div>
        <div id="settings-error" class="usage-note" role="alert"></div>
        <div class="pop-head">context</div>
        <div id="context-box" class="usage-box"></div>
        <div class="pop-head">limits</div>
        <div id="limits-box" class="usage-box"></div>
        <div class="pop-head">tokens</div>
        <div id="usage-box" class="usage-box"></div>
        <wa-harness-status id="harness-status"></wa-harness-status>
        <div class="pop-foot" id="pop-foot"></div>
      </wa-balloon>
    </form>
  </div>

  <wa-menu id="user-menu"></wa-menu>
  <wa-menu id="context-menu"></wa-menu>
  <!-- The `/` commands, anchored to the composer rather than to a point, so they sit above the
       field the reader is typing in instead of over it. -->
  <wa-menu id="command-menu" anchor="input"></wa-menu>

  <script src="components.js"></script>
  <script src="app.js"></script>
</body>
</html>
