<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Module host</title>
<!--
  The module host mounts the modules the route says are mounted, and nothing else.

  This page holds no list of modules. It fetches the listing from beside itself - `index.json`,
  which the module route computes by reading `modules/`, and which a static copy of this tree
  carries because the same Lua wrote it. So deleting `modules/<id>/` removes that module from
  this page with no edit here, and a module nobody enabled changes nothing on screen: the page
  renders only the ids in the listing's `mounted` list, and counts only those.

  A module is not the host: every panel is loaded in a sandboxed frame (no same-origin) with a
  content policy that denies subresources, so a capability this host refuses is refused in
  practice and not only in a label.
-->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; padding: 24px; background: #14161a; color: #e6e8ec;
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  #status { margin: 0 0 20px; color: #9aa1ac; }
  main:empty::after { content: "no module is mounted"; color: #6c737e; }
  section[data-module] { margin: 0 0 16px; border: 1px solid #2b2f36; border-radius: 8px;
                         background: #171a1f; overflow: hidden; }
  section[data-module] > header { display: flex; align-items: baseline; gap: 8px;
                                  padding: 10px 14px; background: #1c2027; }
  .name { font-weight: 600; }
  .meta { color: #9aa1ac; font-size: 12px; }
  .tag { padding: 1px 8px; border-radius: 999px; background: #232830; color: #a9b1bd; font-size: 11px; }
  .slot { margin-left: auto; color: #6c737e; font-size: 11px; }
  .refusals { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 14px 0; }
  .refusal { padding: 2px 8px; border: 1px solid #6b3a28; border-radius: 4px;
             background: #3a2118; color: #f0a087; font-size: 12px; }
  .issues { margin: 0 0 16px; padding: 8px 14px; border: 1px solid #6b3a28; border-radius: 8px;
            background: #2a1a14; color: #f0a087; }
  iframe { display: block; width: 100%; height: 132px; border: 0; background: #0f1115; }
</style>
</head>
<body>
<h1>Module host</h1>
<p id="status">loading module listing…</p>
<main id="mount"></main>
<script>
(function () {
  var listing_url = location.pathname.replace(/[^/]*$/, '') + 'index.json';
  var state = { listing_url: listing_url, ok: false, available: 0, mounted: [], refused: {}, errors: [] };
  window.waHostState = state;
  var mount = document.getElementById('mount');
  var status = document.getElementById('status');

  function element(name, className, text) {
    var node = document.createElement(name);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function mountModule(module) {
    var section = element('section');
    section.setAttribute('data-module', module.id);
    var attach = module.attach || {};
    section.setAttribute('data-attach', (attach.surface || '') + ':' + (attach.slot || ''));
    section.setAttribute('data-tag', module.tag || '');

    var header = element('header');
    header.append(element('span', 'name', module.name || module.id));
    header.append(element('span', 'meta', 'v' + (module.version || '?')));
    if (module.tag) header.append(element('span', 'tag', module.tag));
    header.append(element('span', 'slot', (module.attach && module.attach.surface || '') + ' · ' + (module.description || '')));
    section.append(header);

    var refused = module.refused || [];
    if (refused.length) {
      var box = element('div', 'refusals');
      refused.forEach(function (capability) {
        box.append(element('span', 'refusal', 'refused: ' + capability + ' is not granted by this host'));
      });
      section.append(box);
    }

    var frame = document.createElement('iframe');
    // A module runs beside the host, never inside it: opaque origin, and a policy that denies
    // every subresource, so a refused capability cannot quietly be exercised anyway.
    frame.setAttribute('sandbox', 'allow-scripts');
    frame.setAttribute('csp', "default-src 'none'; style-src 'unsafe-inline'");
    frame.setAttribute('title', module.name || module.id);
    frame.src = new URL(module.entry_url, location.href).href;
    section.append(frame);

    mount.append(section);
    state.mounted.push(module.id);
    state.refused[module.id] = refused;
  }

  window.waHostReady = (async function () {
    var listing;
    try {
      var response = await fetch(listing_url, { cache: 'no-store' });
      if (!response.ok) throw new Error('HTTP ' + response.status);
      listing = await response.json();
    } catch (error) {
      state.errors.push('listing unreadable: ' + error.message);
      status.textContent = 'module listing unavailable (' + error.message + ')';
      return state;
    }
    state.ok = listing.ok === true;
    state.available = listing.available || 0;
    var byId = {};
    (listing.modules || []).forEach(function (module) { byId[module.id] = module; });
    (listing.mounted || []).forEach(function (id) {
      if (byId[id]) mountModule(byId[id]);
      else state.errors.push('listing mounted ' + id + ' with no manifest behind it');
    });
    (listing.issues || []).forEach(function (issue) {
      state.errors.push(issue);
      mount.before(element('p', 'issues', issue));
    });
    var refusals = 0;
    Object.keys(state.refused).forEach(function (id) { refusals += state.refused[id].length; });
    status.textContent = 'mounted ' + state.mounted.length + ' module' + (state.mounted.length === 1 ? '' : 's') +
      ' · ' + refusals + ' refusal' + (refusals === 1 ? '' : 's') +
      (state.errors.length ? ' · ' + state.errors.length + ' problem' + (state.errors.length === 1 ? '' : 's') : '');
    return state;
  })();
})();
</script>
</body>
</html>
