# Pinned WASI components this tree's core runs - every component this node SHIPS, not just the ones
# it cannot start without.
#
# `scripts/deploy.sh` installs these beside the core before the node is restarted
# (scripts/lib/deploy-components.sh), and refuses to install bytes that are not the ones named here: a
# core whose components are missing answers their capability with `component_*_unavailable`, so the
# core and its components are one install.
#
# WHY EVERY COMPONENT. Until 08/11 this file pinned `graph` alone. agent-core, codemode, hooks,
# memory, model-gateway, selfloop, telemetry-sink and wa-email were built and tested but never
# shipped, so their `WA_*_COMPONENT` flags had nothing to turn on and fell back to the native path:
# a node could look like it ran the component it did not have. What this file pins is what a deploy
# installs; what a node actually routes to is `policy.json`'s `features` section (docs/FEATURES.md).
# **Installed is not enabled**: pinning a component here installs it, and leaves it off.
#
# WHAT IS NOT PINNED, and why. Test fixtures are built by the gate, never shipped: `svc-*`,
# `memory-crash`, `memory-wedge`, `mcp-echo`. `wa-whatsapp` is installed by hand on the node that runs
# it (its bytes carry the linked-device client and its credentials file is that node's), and
# `mcp-whatsapp` is a registry definition an operator enables with `mcp put`/`enable`, not a core
# component. A name is shipped by being pinned here; nothing else in the tree decides it.
#
# FORMAT: <name> <sha256> <bytes>. Regenerate a line on the machine that produces the release
# artifacts, from the reviewed tree:
#
#   WASI_SDK=<dir> WA_COMPONENTS_DIR=<artifact-dir> bash scripts/build-components.sh <name>
#   sha256sum <artifact-dir>/<name>.wasm      # -> this line (the size too)
#
# and commit the changed line with the component change that caused it. A build is not
# byte-reproducible across checkout paths (the guest embeds three panic-location paths - measured
# 05/11: two checkouts of the same tree gave 8,185,719 and 8,185,720 bytes; the graph moved again
# when this lock was regenerated from the shipping checkout, 8,216,373 -> 8,216,118 bytes), which is
# why a node installs the pinned artifact instead of rebuilding it.
#
# Where that artifact comes from, in the order a deploy tries it (docs/COMPONENTS.md "Distributing
# components"): the component already installed (when it is these bytes), this node's cache
# (`<install>/components-cache/<sha256 of this file>`), then the release tagged
# `components-<first 12 hex of sha256 of this file>` - which scripts/publish-components.sh builds on the
# machine that has wasi-sdk and prints the `gh release create` command for. Every fetched bundle is
# verified against the lines below (sha256 AND size) before it is cached or staged, and a bundle whose
# own components.lock is not this file is refused. WA_COMPONENT_RELEASE_REPO / WA_COMPONENT_RELEASE_URL
# point a deploy at another repository or a local bundle directory.
#
# A deploy that builds from the tree instead (no pinned bytes reachable and
# WA_DEPLOY_COMPONENT_SOURCE unset) is a development deploy, and it must say so with
# WA_DEPLOY_COMPONENT_REPIN=1 to install what it just built.
