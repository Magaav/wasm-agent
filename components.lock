# Pinned WASI components this tree's core runs - every component this node SHIPS, not just the ones
# it cannot start without.
#
# `scripts/deploy.sh` installs these beside the core before the node is restarted
# (scripts/lib/deploy-components.sh), and refuses to install bytes that are not the ones named here: a
# core whose components are missing answers their capability with `component_*_unavailable`, so the
# core and its components are one install.
#
# WHY EVERY COMPONENT. Until 08/11 this file pinned `graph` alone. agent-core, codemode, hooks,
# memory, model-gateway, selfloop, telemetry-sink and wa-email were built and tested but never
# shipped, so their `WA_*_COMPONENT` flags had nothing to turn on and fell back to the native path:
# a node could look like it ran the component it did not have. What this file pins is what a deploy
# installs; what a node actually routes to is `policy.json`'s `features` section (docs/FEATURES.md).
# **Installed is not enabled**: pinning a component here installs it, and leaves it off.
#
# WHAT IS NOT PINNED, and why. Test fixtures are built by the gate, never shipped: `svc-*`,
# `memory-crash`, `memory-wedge`, `mcp-echo`. `mcp-whatsapp` is a registry definition an operator
# enables with `mcp put`/`enable`, not a core component. A name is shipped by being pinned here;
# nothing else in the tree decides it.
#
# WHY `wa-whatsapp` IS PINNED (11/11). It used to be installed by hand on the one node that ran it,
# which meant that node needed a wasi-sdk toolchain and a build of its own. Its bytes are
# wasm32-wasip2, so they do not depend on the CPU - the same artifact runs on arm64 and x86_64 - and
# building it once here is what makes every node's deploy one command.
#
# Reproducible within one checkout, and still not across two (re-measured 13/11 on the archive repin:
# two builds in this path gave 8,582,128 bytes / `f3d60624…` twice, and the same tree copied to another
# path gave 8,582,132 bytes / `cb410807…`). Measured first on the repin below: two builds
# in one path gave the same sha256; the same commit in two paths gave 8,557,078 bytes / `0bf8762a…`
# and 8,557,275 bytes / `67a9414f…`. The cause is measured too - this component path-depends on
# `wa-whatsapp-outbox` and `wa-whatsapp-index`, and Cargo's `-C metadata` for a path package is a hash
# of its canonical absolute path (`libwa_whatsapp_index-49271f4b…` in one tree, `-5caf7479…` in the
# other) - so the pin names ONE build, the one whose bytes are published with this lock, and no check
# on another machine can rebuild it (docs/COMPONENTS.md, "Reproducible builds").
#
# WHAT KEEPS THE PIN HONEST. `scripts/test-component-pins.sh` is in the fast path and fails when a
# change under a pinned component's source tree - or under a crate it path-depends on - is committed
# without this file's line for it moving. 13/11 is why: `change/waroute` added the `contacts` op to the
# component and the pin did not move, so every deploy installed the bytes built before it and the tool
# answered `whatsapp_contacts_bad_op`; the component's own tests were green because they ran against
# the source. The same check verifies the pinned `wa-whatsapp.wasm` against its line and against the op
# list in `rust/wa-whatsapp-index`, so "the bytes accept every op the seam defines" is a fact about the
# artifact, not about the tree.
#
# Pinning it means EVERY node installs it, so it has to stay inert where nobody wants it.
# Installation writes `<name>.wasm`, its pin and its manifest, and nothing else. A service runs only
# from an ENABLED definition in the services registry (lua/core/services.lua), which no deploy
# creates: with no definition `services.autostart()` returns before it calls the supervisor at all,
# so no instance exists and no WhatsApp connection is opened. Enabling it is an operator action
# (docs/WHATSAPP-CUTOVER.md). A pin is not a policy either: `policy.json` still decides what a node
# routes to, and `wa features` says which path is live.
#
# WHERE THIS FILE STOOD ON 13/11, AND WHY ALL ELEVEN LINES MOVED AT ONCE.
# `scripts/publish-components.sh` built every pinned component from main (e71e18b7) and stopped at the
# first one: `artifact_not_pinned: agent-core is b24672b2…, components.lock pins 02be7eae…`. All eleven
# had drifted and nothing in the gate could see it, because the only bytes check in
# `scripts/test-component-pins.sh` judged `wa-whatsapp`: ten holes were green. The deploy could not work
# either way - it asks for the release `components-495fcca901d7` (the first 12 hex of the sha256 of the
# lock it holds) and no bundle had ever been published for that lock, so every node refused with
# `component_release_unavailable`. `change/repinall` repins all eleven from one measured build, publishes
# the bundle for the new lock, and makes that check judge every component instead of one.
#
# WHAT MOVED, per component, measured on wa-desktop (rustc 1.99.1, wasi-sdk 34): every pinned component
# built twice, in two checkout paths, the two sha256 compared.
#
#   codemode       source: 13 commits since the pin, f2d2c3cc..99edd392 (one registry two views;
#                  natural promises; always fresh and explicit reuse; the pending pool; the fence
#                  sentences)
#   graph          source: 8a7b2131 (one contention policy for every store, in `wa-sqlite`, a path
#                  dependency) and f0e0f55b (the pins check itself, in `rust/components/graph`)
#   mesh           source: d044891d (the `*_many` tools retired from `wa-grant-policy`, a path
#                  dependency)
#   agent-core, hooks, memory, model-gateway, selfloop, telemetry-sink, wa-email
#                  NO source change. Rebuilding the tree that set those pins (441b8ea3) here gives
#                  today's bytes - `agent-core` b24672b2… 392561 - and not the pin (02be7eae…, 396230),
#                  so those pins are the output of another compiler, not of this source: a pin no
#                  toolchain on this node reproduces is a pin this node cannot verify.
#   wa-whatsapp    source unchanged since its pin (14bd0013); its bytes moved with the checkout path
#                  alone (8584087 pinned against 8584349 and 8583921 measured in two worktrees) - the
#                  `-C metadata` effect described above.
#
# The lines below are the build of main e71e18b7 (change/repinall changes no component source) in a
# checkout at /home/wa/wt-repinall on wa-desktop, and the bundle `artifacts/components-<sha12 of this
# file>` holds exactly these bytes, each verified against these lines before it was committed. A rebuild
# in another checkout reproduces the five components without a `path =` dependency byte for byte, and
# the six with one only sometimes (measured 13/11: `graph`, `mesh`, `wa-email` and `wa-whatsapp` differed
# between two paths of one commit, `model-gateway` and `telemetry-sink` did not). That is why a repin is
# `scripts/publish-components.sh --from <the bundle's artifacts>` and not a rebuild: the pin names bytes,
# and the bundle is where those bytes are.
#
# THE LINE ABOVE, MOVED THREE TIMES ON 14/11 (change/abook). One component, one defect, and each move is
# what the previous one's live evidence taught.
#
# FIRST MOVE (f63419ec). The address book the phone had already synced never reached the index: the store
# persists the `regular` collection's VERSION and never its records, so a restart left v9 in the store and
# nothing of v9 in memory, and `wacore`'s `snapshot_is_stale` dropped the snapshot the 13/11 request
# brought back (`incoming v9 <= persisted v9`). It also counted its own `ix/ab/` marks as contacts, which
# is why the answer said `address_book: 1` for a store that held none.
#
# SECOND MOVE (09a59eb3). That deploy proved resetting the version and firing ONE request is not a fetch:
# the log showed the reset, the request, then nothing at all for 25 minutes. `process_sync_task` - the only
# public way to ask - returns `()` and can return WITHOUT contacting the server (`EquivalentSyncInFlight`
# while the connect-time sync holds the collection; `Deferred` before the connection can reach the server),
# both at `debug!`. The component now drives the request from its own supervised loop and names the states
# that must not be silent (no app-state sync key; budget spent).
#
# THIRD MOVE (afab865f). That deploy asked the WRONG COLLECTION. Contacts are not in `regular`:
# `wacore_appstate::schemas::CONTACT` and `schemas::LID_CONTACT` are both declared on
# `Collection::CriticalUnblockLow`, and `whatsapp-rust` says the same where it writes one
# ("WAWebContactSync writes ["contact", jid] to critical_unblock_low"). `regular` carries pins, archives,
# mutes and stars, so a full snapshot of it applies, advances the version, and carries nothing this index
# reads. The component now asks `critical_unblock_low` only, and the closing line reports what it OBSERVED
# (the collection, the version, the app-state action events counted and of which kinds) instead of
# concluding anything about the phone - the previous line claimed the account had no saved contact, which
# was false. A test asserts the collection against the schema registry, so this cannot drift back.
#
# FOURTH MOVE (4e0ddf27), the one that makes the third take effect on the live node. `ix/ab/full` used to be
# a bare flag, and the third build wrote it after asking `regular`, so the account node's store holds a
# "book received" mark for a book it never received - and the fixed build would have read it and asked
# nothing. The mark now stores the collection's own name and is read against `CONTACT_COLLECTION`, so a
# legacy flag is stale rather than binding.
#
# FIFTH MOVE (d8f4d74f). The fourth build logged `full critical_unblock_low snapshot requested` and every
# request went out as `regular`: `guest` mapped `CONTACT_COLLECTION` to `WAPatchName::Regular`, and the
# library writes that name straight into the IQ, so the server answered `regular` and its snapshot was
# dropped as stale - the same `incoming v9 <= persisted v9` for a third deploy. The mapping now lives in
# one place, `index::contact_patch_name`, derived from `schemas::CONTACT.collection`, and a test asserts
# the wire spelling equals `CONTACT_COLLECTION`. A log label is not evidence about the wire.
#
# The bytes here are the build of the latest commit of change/abook in the checkout /home/wa/wt-abook on
# wa-desktop (rustc 1.99.1,
# wasi-sdk 34). Measured rather than assumed: two builds of that commit in that ONE path are
# byte-identical (d8f4d74f twice, each with a fresh CARGO_TARGET_DIR), and two checkout paths are NOT
# equal for a component with a path dependency (the first build of this change measured 8,754,838 /
# f63419ec in /home/wa/wt-abook against 8,754,778 / 20e0516a in /home/wa/wt-abook-b at one commit) -
# Cargo's `-C metadata` from the absolute path of `wa-whatsapp-index` and `wa-whatsapp-outbox`
# (docs/COMPONENTS.md, "Reproducible builds"). A pin names ONE build: the bundle
# `artifacts/components-<sha12 of this file>` holds these bytes, each verified against these lines before
# it was committed. The ten other lines are untouched and carry the exact bytes they already named.
#
# FORMAT: <name> <sha256> <bytes>. Regenerate a line on the machine that produces the release
# artifacts, from the reviewed tree:
#
#   WASI_SDK=<dir> WA_COMPONENTS_DIR=<artifact-dir> bash scripts/build-components.sh <name>
#   sha256sum <artifact-dir>/<name>.wasm      # -> this line (the size too)
#
# and commit the changed line with the component change that caused it. A build is not
# byte-reproducible across checkout paths (13/11 on this node: the five pinned components without a
# `path =` dependency reproduced byte for byte from two paths, and of the six with one, `graph`, `mesh`,
# `wa-email` and `wa-whatsapp` did not - the graph differs by 0 bytes and not the same ones, because
# Cargo's `-C metadata` for a path package is a hash of its canonical absolute path), which is why a
# node installs the pinned artifact instead of rebuilding it.
#
# Where that artifact comes from, in the order a deploy tries it (docs/COMPONENTS.md "Distributing
# components"): the component already installed (when it is these bytes), this node's cache
# (`<install>/components-cache/<sha256 of this file>`), then the release tagged
# `components-<first 12 hex of sha256 of this file>` - which scripts/publish-components.sh builds on the
# machine that has wasi-sdk and prints the `gh release create` command for. Every fetched bundle is
# verified against the lines below (sha256 AND size) before it is cached or staged, and a bundle whose
# own components.lock is not this file is refused. WA_COMPONENT_RELEASE_REPO / WA_COMPONENT_RELEASE_URL
# point a deploy at another repository or a local bundle directory.
#
# A deploy that builds from the tree instead (no pinned bytes reachable and
# WA_DEPLOY_COMPONENT_SOURCE unset) is a development deploy, and it must say so with
# WA_DEPLOY_COMPONENT_REPIN=1 to install what it just built.
