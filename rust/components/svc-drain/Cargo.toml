[package]
name = "svc-drain"
version = "0.1.0"
edition = "2021"
publish = false

# Fixture service component for the drained hot swap (docs/SERVICE-COMPONENTS.md, "A swap waits for
# the work in flight"): it consumes a job from `wa:queue/worker`, finishes the handle in hand, and only
# then reports `idle` over `wa:kernel/drain@0.2.0` - which is what lets a swap complete a job exactly
# once instead of stopping the instance and retrying it. Also the two fallbacks the swap must keep:
# a mode that ignores the drain (the deadline path) and a job slow enough to outlive the grace.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
strip = true
