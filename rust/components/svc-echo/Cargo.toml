[package]
name = "svc-echo"
version = "0.1.0"
edition = "2021"
publish = false

# Fixture service component on wa:kernel@0.2 (wasm32-wasip2, WASI 0.3 native async): the same
# contract the 0.1 fixture speaks, with the waiting done by the runtime instead of a guest loop.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"
wit-bindgen = "0.63"

[profile.release]
opt-level = "s"
strip = true
