[package]
name = "agent-core"
version = "0.1.0"
edition = "2021"
publish = false

# The Lua core as one wasm32-wasip2 component (docs/KERNEL.md, "A2.1"): wa-host's vendored Lua 5.4
# compiled with wasi-sdk, every `host.*` reached through the one `wa:kernel/host.call` import.
# Built by scripts/build-agent-core.sh (needs wasi-sdk), not by build-components.sh: no manifest.json.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
wit-bindgen = "0.63"

[build-dependencies]
cc = "1"

[profile.release]
# What the guest's *own* code costs, which is the largest slice of a turn (docs/KERNEL.md, "A2.1":
# the interpreter work happens inside this module). The default `opt-level = 2` left measured money on
# the table: `-O3` plus fat LTO across the Rust shim, wit-bindgen's glue and Lua's C, one codegen unit
# so LTO has the whole program in view. `strip` keeps the shipped file small; debug info is not read by
# a wasmtime that is not debugging it, and `scripts/bench-core-bridge.sh` measures the change.
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
