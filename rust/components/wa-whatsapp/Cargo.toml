[package]
name = "wa-whatsapp"
version = "0.1.0"
edition = "2021"
publish = false

# WhatsApp linked-device service component (wasm32-wasip2, wa:kernel@0.2 / WASI 0.3): whatsapp-rust's
# protocol core with the runtime, transport, HTTP, recognizer and store supplied by the host
# (docs/SERVICE-COMPONENTS.md).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# The explicit-send outbox's request shape, JID rules and dedupe key: the same source the node
# enqueues with (`rust/wa-capabilities/src/whatsapp_send.rs`), so the two ends cannot disagree
# (docs/SERVICE-COMPONENTS.md, "Sending an ordinary message").
wa-whatsapp-outbox = { path = "../../wa-whatsapp-outbox" }
# The query seam (`whatsapp.query`): the request/answer shape and its bounds, shared with the node
# capability that enqueues a query and reads the answer back (docs/SERVICE-COMPONENTS.md).
wa-whatsapp-index = { path = "../../wa-whatsapp-index" }
whatsapp-rust = { version = "=0.7.0", default-features = false }
wacore = { version = "=0.7.0", default-features = false }
async-trait = "0.1"
async-channel = "2"
anyhow = "1"
bytes = "1"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
serde_json = "1"
wit-bindgen = "0.63"
serde = { version = "1", features = ["derive"] }
wacore-appstate = { version = "=0.7.0", default-features = false }
log = { version = "0.4", features = ["std"] }
# The log/telemetry digest (`privacy::mark`): `sha256:` + the first 16 bytes, the audit trail's own
# convention. Already in this graph through `wacore`'s dependencies at 0.10.9, so this is a direct edge
# to a crate that is already built for the component target - no new code, no new download.
sha2 = "0.10"

[dev-dependencies]
# The native tests drive the same futures the guest awaits (`recognize::steps`) to a conclusion;
# `block_on` is the only executor they need and it comes from the futures crate already used above.
# Dev-only: `cargo build --target wasm32-wasip2` does not see this feature set.
futures = { version = "0.3", default-features = false, features = ["std", "async-await", "executor"] }
# A history sync reaches the component zlib-compressed, so the one test that drives the real wire shape
# (compressed blob -> `LazyHistorySync::stream()` -> records) needs a compressor. `zlib-rs` is the zlib
# backend already in this graph through `wacore-binary`, so this adds no new code to the build.
zlib-rs = "0.6"

[profile.release]
opt-level = "s"
strip = true
# LTO off while iterating (a full-LTO build of this graph takes >25 min); turn it on for releases.
