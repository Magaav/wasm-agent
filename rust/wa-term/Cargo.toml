[package]
name = "wa-term"
version = "0.1.0"
edition = "2021"

# The console: the terminal/editor/input/panel surface and the transcript it draws. It is a leaf in
# the split - nothing below it needs it and nothing in it needs the host - so a UI change rebuilds it
# and the binary, and nothing else.
[dependencies]
wa-host-support = { path = "../wa-host-support" }
# The row's *decision* (parsers, tail, stall rule, row text) for a long tool call: a leaf with one
# dependency, shared with `wa-capabilities` (which feeds it the operation's tail) and pinned against
# the Lua and window renderers by the same wording.
wa-tool-progress = { path = "../wa-tool-progress" }
serde_json = "1"
base64 = "0.23"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
