[package]
name = "wa-operation"
version = "0.1.0"
edition = "2021"

[dependencies]
# Contention policy for every SQLite store (rust/wa-sqlite): one busy timeout, WAL, and a bounded
# retry that names itself instead of dying as `database is locked`. A leaf crate.
wa-sqlite = { path = "../wa-sqlite" }
serde_json = "1"
base64 = "0.23"
rusqlite = { version = "0.32", features = ["bundled"] }
ring = "0.17"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_JobObjects"] }
