[package]
name = "wa-snapshot"
version = "0.1.0"
edition = "2021"
description = "Consistent, checked snapshots of SQLite stores that are being written (online backup API, busy timeout, bounded retries)"

[dependencies]
# The workspace's SQLite. `backup` enables rusqlite::backup (sqlite3_backup_*), which is part of the
# bundled amalgamation wa-capabilities already compiles: no new crate, no C build, no system SQLite.
rusqlite = { version = "0.32", features = ["bundled", "backup"] }

[dev-dependencies]
# Scratch directories for the live-writer tests. Already in rust/Cargo.lock (wa-bounded).
tempfile = "3"
