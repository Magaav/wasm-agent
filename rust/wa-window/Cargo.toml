[package]
name = "wa-window"
version = "0.1.0"
edition = "2021"

[workspace]

[[bin]]
name = "wa-window"
path = "src/main.rs"

[target.'cfg(target_os = "windows")'.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = { version = "0.36", default-features = false, features = ["rwh_06"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
wry = { version = "0.56.1", default-features = false, features = ["os-webview"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
