[package]
name = "wa-kernel-runtime"
version = "0.1.0"
edition = "2021"

# The wasm runtime half of the microkernel (docs/KERNEL.md, docs/COMPONENTS.md,
# docs/SERVICE-COMPONENTS.md): the engine and its pins, the v1 runner, the WASI 0.3 (`wa:kernel@0.2`)
# async runner, the host-side websocket/http/kv the services import, the speech bridge, and the three
# providers a component subscribes through - `wa:queue`, `wa:bus`, `wa:state`.
#
# It sits above `wa-governance` (the policy and telemetry every call passes through) and
# `wa-host-support` (the Lua ABI its entry points answer on, the component directory), and below the
# capability crate and the binary. Nothing here imports the capability crate: `push_json` is the only
# answer shape it shares with it, and that lives in `wa-host-support`.
[dependencies]
wa-host-support = { path = "../wa-host-support" }
wa-governance = { path = "../wa-governance" }
wa-grant-policy = { path = "../wa-grant-policy" }
wa-queue = { path = "../wa-queue" }
# Queue phase 2 for speech (docs/QUEUE.md): the request payload, the signed wire bodies, the
# preference policy and both worker loops. A leaf crate (wa-queue + serde_json) the node half in
# `stt_node.rs` is wired to; it adds no arrow the queue split did not already have.
wa-stt-remote = { path = "../wa-stt-remote" }
wa-bus = { path = "../wa-bus" }
wa-state = { path = "../wa-state" }
wa-kv = { path = "../wa-kv" }
anyhow = "1"
ring = "0.17"
serde_json = "1"
# `hooks`: the authorizer (`sql_host`) is how `wa:kernel/sql` enforces a grant - SQLite asks, the
# host answers per table/column/pragma/function, and a statement cannot talk its way past it. The
# feature also gives the progress handler that bounds a wedged query.
rusqlite = { version = "0.32", features = ["bundled", "hooks"] }
ureq = { version = "3", features = ["json"] }
# component-model-async: wa:kernel@0.2 components (WASI 0.3) suspend instead of polling, and the host
# drives them with `store.run_concurrent` (service_components_v2.rs).
# pooling-allocator: `components::pooled_engine` is the engine the agent-core instance pool uses
# (docs/KERNEL.md, "A2.3"); without the feature `InstanceAllocationStrategy` has no `Pooling` variant.
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std", "component-model", "component-model-async", "async", "gc", "gc-drc", "anyhow", "pooling-allocator"] }
# p3: `wasi:clocks@0.3.0`, the suspending timer a 0.2 guest awaits; it is built on tokio's timer,
# so the 0.2 runner owns a current-thread tokio runtime. `net` (and the IO driver it brings) is only
# *enabled* for a run that was granted a socket scope (`wasi_grants::Plan::sockets`): a component with
# no network keeps a timer-only runtime, and `wasmtime-wasi`'s socket implementation needs the IO
# driver (`tokio::net`) the moment one is granted.
wasmtime-wasi = { version = "50", default-features = false, features = ["p1", "p2", "p3"] }
# `wasi:io/{error,poll,streams}@0.2.0` are the transport the preview-2 interfaces are built on. The
# v2 runner links them one by one (docs/WASI-INTERFACES.md, tier A) with the rest of preview-2 so a
# component that imports only a granted interface does not get the whole preview-2 surface with it;
# `wasmtime-wasi` re-exports these implementations but keeps its own `add_async_io_to_linker` private.
wasmtime-wasi-io = { version = "50", default-features = false }
tokio = { version = "1", features = ["rt", "time", "net"] }
# Host-side websocket for service components (service_io.rs).
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
