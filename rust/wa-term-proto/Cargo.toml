[package]
name = "wa-term-proto"
version = "0.1.0"
edition = "2021"

# THE WIRE between the node and the terminal program (`rust/wa-term`'s `bin/wa-term`). It is its own
# leaf, with two dependencies and no knowledge of either side's types, because the point of the move is
# that the node stops linking `wa-term`: what the two say to each other has to outlive that crate in
# the node's tree (docs/missions/reports/wa-term-own-program.md).
[dependencies]
serde_json = "1"
base64 = "0.23"
