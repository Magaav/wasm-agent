[package]
name = "wa-rendezvous"
version = "0.1.0"
edition = "2021"

# Node identity and the transport a node registers with (docs/KERNEL.md: "node identity + transport
# (`node_identity`, `sign`, `verify`, `relay`, `binding_*`)"). It sits above `wa-host-support` because
# it resolves home, signs with ring and keeps its own sqlite book-keeping; the host and the serve layer
# call into it, and it calls into nothing above itself.
[dependencies]
# Contention policy for every SQLite store (rust/wa-sqlite): one busy timeout, WAL, and a bounded
# retry that names itself instead of dying as `database is locked`. A leaf crate.
wa-sqlite = { path = "../wa-sqlite" }
wa-host-support = { path = "../wa-host-support" }
wa-operation = { path = "../wa-operation" }
ring = "0.17"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }

# Whose certificates are trusted: the relay may be behind a private CA, and SSL_CERT_FILE /
# SSL_CERT_DIR is how this machine says so. Read by wa-tls, the answer every client here shares.
[dependencies.wa-tls]
path = "../wa-tls"

# The scratch HTTPS server the relay tests handshake against.
[dev-dependencies.wa-tls]
path = "../wa-tls"
features = ["scratch"]
