[package]
name = "wa-rendezvous"
version = "0.1.0"
edition = "2021"

# Node identity and the transport a node registers with (docs/KERNEL.md: "node identity + transport
# (`node_identity`, `sign`, `verify`, `relay`, `binding_*`)"). It sits above `wa-host-support` because
# it resolves home, signs with ring and keeps its own sqlite book-keeping; the host and the serve layer
# call into it, and it calls into nothing above itself.
[dependencies]
wa-host-support = { path = "../wa-host-support" }
wa-operation = { path = "../wa-operation" }
ring = "0.17"
serde_json = "1"
ureq = { version = "3", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
