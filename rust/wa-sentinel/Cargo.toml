[package]
name = "wa-sentinel"
version = "0.1.0"
edition = "2021"

# Its own lock file: the sentinel is a supervisor, and a supervisor that shares a dependency graph with
# the thing it supervises can be broken by that thing's build.
[workspace]

[dependencies]
wa-operation = { path = "../wa-operation" }
wa-jobs = { path = "../wa-jobs" }
ring = "0.17"
anyhow = "1"
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading"] }
