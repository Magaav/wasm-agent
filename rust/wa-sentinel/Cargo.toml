[package]
name = "wa-sentinel"
version = "0.1.0"
edition = "2021"

# Its own lock file: the sentinel is a supervisor, and a supervisor that shares a dependency graph with
# the thing it supervises can be broken by that thing's build.
[workspace]

[dependencies]
wa-operation = { path = "../wa-operation" }
# The one feature resolver (docs/FEATURES.md), so `wa health` reads the same switch the node routes on
# instead of inventing a second answer: a row that declares `"default": "off"` is dormant here exactly
# when the node would run it - the graph, off on every node from G (docs/GRAPH.md).
wa-features = { path = "../wa-features" }
wa-jobs = { path = "../wa-jobs" }
ring = "0.17"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_Services", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
