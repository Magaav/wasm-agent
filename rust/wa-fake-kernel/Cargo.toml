[package]
name = "wa-fake-kernel"
version = "0.1.0"
edition = "2021"
description = "The wa:kernel@0.2 host side, in memory: run a real component's tests with cargo test, no node."

[dependencies]
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std", "component-model", "component-model-async", "async", "gc", "gc-drc", "anyhow"] }
wasmtime-wasi = { version = "50", default-features = false, features = ["p1", "p2", "p3"] }
tokio = { version = "1", features = ["rt", "time"] }
serde_json = "1"
wa-bounded = { path = "../wa-bounded" }

[dev-dependencies]
