[package]
name = "wa-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wa"
path = "src/main.rs"

[dependencies]
wa-operation = { path = "../wa-operation" }
wa-jobs = { path = "../wa-jobs" }
wa-graph = { path = "../wa-graph" }
anyhow = "1"
base64 = "0.23"
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
wasmtime = { version = "37", default-features = false, features = ["cranelift", "runtime", "std"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_SystemInformation", "Win32_System_Threading"] }

[build-dependencies]
cc = "1"
