[package]
name = "wa-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wa"
path = "src/main.rs"

# The binary is the wiring (docs/KERNEL.md, "three layers"): it resolves HOME, opens the interpreter,
# dispatches the CLI and hands the run to a library crate. Each dependency below is a layer of the split
# and is in the list because `main.rs` names it, not because the crate it came from needed it.
[dependencies]
# The floor: the Lua 5.4 ABI, the host paths and the JSON answer shared with the kernel.
wa-host-support = { path = "../wa-host-support" }
# Node identity and the rendezvous/relay transport (docs/KERNEL.md, carve-out map): the CLI dispatches
# `rendezvous` and the binding commands through them.
wa-rendezvous = { path = "../wa-rendezvous" }
# The capability registry, the `host.*` implementations and the serve/subagent layer over them.
wa-capabilities = { path = "../wa-capabilities" }
# `wa dev`: the dev-loop hot swap is `wa-kernel-runtime`'s (the same spawn a supervised start runs),
# so the node does not grow a second way to start a component.
wa-kernel-runtime = { path = "../wa-kernel-runtime" }
# The database the interpreter's own connection opens, and the sha256 of the installed Lua tree
# (`--capability-digest`, `--lua-tree`) that must match this binary's.
ring = "0.17"
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }

[build-dependencies]
# Nothing but `std`: the embedded Lua tree is read from the checkout, and the code-mode assets moved
# with `quickjs.rs` to `wa-capabilities/build.rs`.
