[package]
name = "wa-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wa"
path = "src/main.rs"

[dependencies]
wa-operation = { path = "../wa-operation" }
wa-jobs = { path = "../wa-jobs" }
anyhow = "1"
ring = "0.17"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
wasmtime = { version = "37", default-features = false, features = ["cranelift", "runtime", "std"] }

[build-dependencies]
cc = "1"
